[build-system]
requires = ["poetry-core>=2.2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "pybsm"
license = "Apache-2.0"
readme = "README.md"
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: Unix',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
version = "0.16.1"
authors = [{name = "Kitware, Inc.", email = "nrtk@kitware.com"}]
description = "pyBSM is a Python-based tool for sensor modeling. It provides common components useful for simulating the image formation process through different imaging systems."

requires-python = ">=3.10"

# Keep separate Python ranges so Poetry can select compatible NumPy versions.
# https://stackoverflow.com/questions/77431252/why-doesnt-poetry-select-the-good-version-of-my-dependency
# NumPy ranges match SMQTK; NumPy 1 and 2 are supported on
# Python 3.10–3.12. Numba supplies its own NumPy compatibility bounds.
dependencies = [
    "numpy>=1.23.5; python_version < '3.13'",
    "numpy>=2.1; python_version >= '3.13' and python_version < '3.14'",
    "numpy>=2.3.2; python_version >= '3.14'",
    "matplotlib>=3.5.2",
    "typing-extensions>=4.5.0",
    "scipy>=1.10.0; python_version < '3.13'", # CVE-2023-25399
    "scipy>=1.14.1; python_version >= '3.13'",
    "setuptools>=83.0.0", # CVE-2026-59890
    "numba>=0.62.1,<0.63.0; python_version < '3.13'",
    "numba>=0.63.0; python_version >= '3.13'",
]

[project.urls]
Documentation = "https://pybsm.readthedocs.io/"

[tool.poetry]
packages = [{include = "pybsm", from="src"}]

[dependency-groups]
# Linting
linting = [
    "ruff>=0.15.0,<0.16.0",
    "types-setuptools>=65.6.0.1",
    "sphinx-lint>=1.0.0",
    # required for pre-commit hook
    "pre-commit>=2.20",
    "pyright[nodejs]>=1.1.320,<1.1.409",
]

# Docs
docs = [
    "Sphinx>=5.3.0",
    "sphinx-copybutton>=0.5.2,<0.6.0",
    "sphinx-rtd-theme>=1.1.1",
    "sphinx-prompt>=1.5.0",
    "sphinx-click>=5.0.0",
    "livereload>=2.6.3",
    "myst-nb>=1.1.2,<2.0.0",
]

# Testing
tests = [
    # pytest unittesting
    "pytest>=9.0.3", # CVE-2025-71176
    "pytest-cov>=4.0.0", # reports code coverage
    "syrupy>=5.0.0", # required for snapshot/regression testing
    # required for custom conftest.py fixtures
    "Pillow>=12.3.0; python_version < '3.11'",  # CVE-2026-54058
    "Pillow>=13.0.0; python_version >= '3.11'",  # CVE-2026-112400
]

[tool.pytest.ini_options]
addopts = [
    "-lv",                              # Show local in trace-backs.
    "--doctest-modules",                # Increased verbosity.
    "--tb=long",                        # Trace-back print mode.
    "--cov=./src/pybsm",          # Cover our package specifically
    "--cov=./tests",                    # Also cover our tests for dead spots
    "--cov-report=term",                # Coverage report to terminal
    "--cov-report=xml:coverage.xml",    # for external tool reporting
    "--snapshot-warn-unused",           # Prevent test failure when skipping tests
]
testpaths = [
    "tests",
    "src/pybsm",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
]

[tool.ruff]
# Exclude content as appropriate.
extend-exclude = [
    "__pycache__",
    "demos",
    "./scripts",
    "docs/_build",
    "docs/_implementations",
    ".tox",
]

line-length = 120
indent-width = 4

# Assume Python 3.10
target-version = "py310"

extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "C90", "I", "N", "D", "UP",
    "YTT", "ANN", "S",  "BLE", "B", "A", "COM", "C4", "T10", "ISC", "ICN", "PLR0917", "PYI", "PT", "Q",
    "RSE", "RET", "SLF", "SIM", "TID252", "ARG", "FIX", "PD", "FLY", "NPY", "RUF027",
    "RUF100", "PERF", "UP045", "RUF013"
]
preview = true  # needed for RUF027
explicit-preview-rules = true

# From program suggested config
ignore = ["C416"]
external = ["FKA100"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"**/*tests/*.py" = [
  "S101",  # Allow asserts in tests
  "SLF001",  # Allow private member access for introspection in tests
  "D100", "D101", "D102", "D103", "D104", "D105", "D107",  # Allow missing docstring in test dir
  "PLR0917"  # Allow more than one positional arg in tests
]
"docs/examples/*.ipynb" = [
   "PLR0917"  # Allow more than one positional arg in notebooks
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true  # Allow Any for *args and **kwargs

[tool.ruff.lint.isort]
known-first-party = ["pybsm"]

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 5.
max-complexity = 5

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.ruff.lint.pylint]
max-positional-args = 1

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pyright]
pythonVersion = "3.10"
reportMissingImports = "warning"
reportDeprecated = "warning"
typeCheckingMode = "standard"
reportImplicitOverride = "error"
include = [
    "src/pybsm",
    "tests",
    "scripts",
    "docs",
    ]
exclude = [
    "**/__pycache__",
    "docs/_build",
    "docs/_implementations",
    ".tox",
    ]
