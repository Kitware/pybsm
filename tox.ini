[tox]
requires = tox>=4.22
env_list = py{310,311,312,313,314}-pytest

[testenv]
description = Run tests and doctests with pytest
skip_install = true
dependency_groups = tests
deps = -e .
pass_env = NUMBA_NUM_THREADS
set_env =
    COVERAGE_FILE = .coverage.{envname}
    MPLBACKEND = Agg
commands =
    ; Numba already parallelizes the numerical kernels; keep pytest serial.
    pytest --junit-xml=.junit.{envname}.xml -rfE --tb=short -q --no-header --disable-warnings

; Standalone env so it won't run with `tox` or `tox -f py310`.
; Run explicitly with: tox -e coverage
; Combines .coverage.* files, generates XML, and enforces the 90% threshold
; (JATIC SDP requirement).
; coverage[toml] is kept here (not in pyproject.toml) because this is a standalone
; CI utility env — no other env or developer workflow needs it as a direct dependency.
[testenv:coverage]
description = Combine coverage reports and enforce the 90% threshold
base_python = py310
dependency_groups =
deps = coverage[toml]>=6.5.0
set_env = COVERAGE_FILE = .coverage
commands =
    coverage combine --keep
    coverage xml
    coverage report --precision=2 --fail-under=90 --skip-covered --show-missing

[testenv:py{310,311,312,313,314}-example]
description = Run the original example script
dependency_groups =
commands = python {tox_root}/docs/examples/pybsm_example.py

; Standalone env so it won't run with `tox` or `tox -f py310`.
; Run explicitly with: tox -e papermill -- <notebook> <output>
; papermill and notebook are kept here (not in pyproject.toml) because this is a
; standalone CI utility env — no other env or developer workflow needs them.
[testenv:papermill]
description = Run notebooks against a locally built wheel
base_python = py313
skip_install = false
package = wheel
dependency_groups =
deps =
    nbstripout>=0.6.0
    papermill>=2.4.0
    notebook>=7.2.2
change_dir = {tox_root}/docs/examples
commands =
    papermill --progress-bar -k python3 --stdout-file - --stderr-file - {posargs}
    nbstripout --keep-output --keep-count {posargs}

; ─── Quality environments ───────────────────────────────────────────
; Standalone envs (not in env_list); run explicitly with tox -e <env>.

[testenv:precommit]
description = Run formatting, linting, and internal and external type checks
base_python = py313
pass_env =
    {[testenv]pass_env}
    PRE_COMMIT_HOME
dependency_groups =
    linting
    tests
commands = pre-commit run --all-files
